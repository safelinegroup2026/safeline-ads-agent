<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeLine Ads Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #e0231b;
    --dark-red: #5f0515;
    --salmon: #c05a3e;
    --beige: #ece5e3;
    --black: #0d0d0d;
    --white: #ffffff;
    --bg: #f7f4f3;
    --surface: #ffffff;
    --surface-2: #f0ebe9;
    --border: #e0d8d5;
    --grey-1: #f5f3f2;
    --grey-2: #e8e3e1;
    --grey-3: #8a7f7c;
    --grey-4: #5a5250;
    --text-primary: #1a1210;
    --text-secondary: #5a5250;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 6px;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--red);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    padding: 6px;
  }

  .logo-mark span {
    background: var(--white);
    display: block;
  }

  .logo-mark span:nth-child(2),
  .logo-mark span:nth-child(3) {
    background: var(--red);
  }

  .logo-text {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }

  .logo-text em {
    font-style: normal;
    color: var(--grey-3);
    font-weight: 400;
    font-size: 13px;
    display: block;
    margin-top: 1px;
    font-family: var(--mono);
  }

  .header-badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--salmon);
    background: rgba(192,90,62,0.08);
    border: 1px solid rgba(192,90,62,0.2);
    padding: 4px 10px;
    border-radius: 100px;
  }

  /* MAIN LAYOUT */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
  }

  /* SIDEBAR */
  aside {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .field-group label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--grey-3);
    margin-bottom: 10px;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .pill {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 400;
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--grey-4);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pill:hover { border-color: #c0b0ab; color: var(--text-primary); background: var(--beige); }

  .pill.active {
    background: var(--red);
    border-color: var(--red);
    color: var(--white);
    font-weight: 500;
  }

  .generate-btn {
    margin-top: auto;
    width: 100%;
    padding: 14px;
    background: var(--red);
    color: var(--white);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.2px;
  }

  .generate-btn:hover { background: #c01e15; }
  .generate-btn:disabled { background: #e8d0ce; color: #b09090; cursor: not-allowed; }

  /* OUTPUT AREA */
  .output-area {
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
    max-height: calc(100vh - 73px);
    background: var(--bg);
  }

  .output-empty {
    margin: auto;
    text-align: center;
    color: var(--grey-3);
  }

  .output-empty svg { margin-bottom: 16px; opacity: 0.25; }
  .output-empty p { font-size: 14px; line-height: 1.6; max-width: 280px; color: var(--grey-3); }

  /* RESULT CARDS */
  .result-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .meta-tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 100px;
    border: 1px solid;
  }

  .meta-tag.channel { color: #9b3a22; border-color: rgba(192,90,62,0.3); background: rgba(192,90,62,0.08); }
  .meta-tag.audience { color: #1a7a62; border-color: rgba(26,122,98,0.25); background: rgba(26,122,98,0.07); }
  .meta-tag.market { color: #1e4f8a; border-color: rgba(30,79,138,0.25); background: rgba(30,79,138,0.07); }

  .variants-grid {
    display: grid;
    gap: 16px;
  }

  .variant-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    position: relative;
  }

  .variant-label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--red);
    margin-bottom: 14px;
  }

  .ad-section {
    margin-bottom: 14px;
  }

  .ad-section:last-child { margin-bottom: 0; }

  .ad-section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--grey-3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .ad-headlines {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .headline-item {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    background: var(--surface-2);
    border-radius: 4px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .char-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--grey-3);
  }

  .char-count.over { color: #c0392b; }

  .ad-body {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-secondary);
    background: var(--surface-2);
    border-radius: 4px;
    padding: 10px 12px;
    border-left: 2px solid var(--border);
  }

  .ad-cta {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    color: #9b3a22;
    background: rgba(192,90,62,0.08);
    border: 1px solid rgba(192,90,62,0.2);
    border-radius: 100px;
    padding: 4px 12px;
    margin-top: 6px;
  }

  .copy-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--grey-3);
    cursor: pointer;
    transition: all 0.15s;
  }

  .copy-btn:hover { background: var(--beige); color: var(--text-primary); }
  .copy-btn.copied { color: #1a7a62; border-color: rgba(26,122,98,0.3); }

  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--grey-3);
    margin-bottom: 16px;
  }

  .loading-state {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--grey-3);
    font-size: 14px;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .stream-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-secondary);
    white-space: pre-wrap;
  }

  .error-msg {
    color: #c0392b;
    font-size: 13px;
    background: rgba(192,57,43,0.06);
    border: 1px solid rgba(192,57,43,0.2);
    border-radius: var(--radius);
    padding: 12px 16px;
  }

  /* TARGETING BOX */
  .targeting-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 20px;
  }

  .targeting-box .ad-section-label { margin-bottom: 10px; }

  .targeting-line {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .targeting-line strong {
    color: var(--text-primary);
    font-weight: 500;
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="logo-text">
    SafeLine Ads Agent
    <em>Powered by Claude · safelinegroup.com</em>
  </div>
  <div class="header-badge">v1.0 · All markets</div>
</header>

<main>
  <aside>
    <div class="field-group">
      <label>Channel</label>
      <div class="pills" id="channel-pills">
        <button class="pill active" data-val="google">Google Ads</button>
        <button class="pill" data-val="linkedin">LinkedIn Ads</button>
        <button class="pill" data-val="meta">Meta Ads</button>
      </div>
    </div>

    <div class="field-group">
      <label>Audience</label>
      <div class="pills" id="audience-pills">
        <button class="pill active" data-val="property_owners">Property owners</button>
        <button class="pill" data-val="facilities_managers">Facilities managers</button>
        <button class="pill" data-val="lift_companies">Lift companies</button>
      </div>
    </div>

    <div class="field-group">
      <label>Market</label>
      <div class="pills" id="market-pills">
        <button class="pill active" data-val="uk">UK</button>
        <button class="pill" data-val="sweden">Sweden</button>
        <button class="pill" data-val="dach">DACH</button>
        <button class="pill" data-val="benelux">Benelux</button>
      </div>
    </div>

    <div class="field-group">
      <label>Product focus</label>
      <div class="pills" id="product-pills">
        <button class="pill active" data-val="orion">SafeLine Orion</button>
        <button class="pill" data-val="sl6">SL6</button>
        <button class="pill" data-val="nova">Nova</button>
        <button class="pill" data-val="lyra">LYRA</button>
        <button class="pill" data-val="brand">Brand Awareness</button>
      </div>
    </div>

    <div class="field-group">
      <label>Language</label>
      <div class="pills" id="lang-pills">
        <button class="pill active" data-val="en">English</button>
        <button class="pill" data-val="sv">Svenska</button>
        <button class="pill" data-val="de">Deutsch</button>
        <button class="pill" data-val="nl">Nederlands</button>
      </div>
    </div>

    <button class="generate-btn" id="generate-btn" onclick="generateAds()">
      Generate ad copy →
    </button>
  </aside>

  <div class="output-area" id="output">
    <div class="output-empty">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="8" width="40" height="32" rx="4" stroke="#8a7f7c" stroke-width="2"/>
        <path d="M4 16h40" stroke="#8a7f7c" stroke-width="2"/>
        <path d="M12 24h8M12 30h16" stroke="#8a7f7c" stroke-width="2" stroke-linecap="round"/>
        <circle cx="38" cy="34" r="6" fill="#e0231b"/>
        <path d="M38 31v4M38 36.5v.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p>Select channel, audience, market and product — then generate your ad copy.</p>
    </div>
  </div>
</main>

<script>
const state = {
  channel: 'google',
  audience: 'property_owners',
  market: 'uk',
  product: 'orion',
  lang: 'en'
};

function setupPills(groupId, key) {
  document.getElementById(groupId).querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.getElementById(groupId).querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      state[key] = p.dataset.val;
    });
  });
}

setupPills('channel-pills', 'channel');
setupPills('audience-pills', 'audience');
setupPills('market-pills', 'market');
setupPills('product-pills', 'product');
setupPills('lang-pills', 'lang');

function charCount(str, limit) {
  const n = str.length;
  return `<span class="char-count ${n > limit ? 'over' : ''}">${n}/${limit}</span>`;
}

function buildPrompt() {
  const channelMap = { google: 'Google Ads', linkedin: 'LinkedIn Ads', meta: 'Meta Ads (retargeting)' };
  const audienceMap = { property_owners: 'property owners / building owners', facilities_managers: 'facilities managers', lift_companies: 'lift service companies and installers' };
  const marketMap = { uk: 'United Kingdom (lead with PSTN urgency and EN81-28 compliance)', sweden: 'Sweden (emphasise NIS2/GDPR and data independence)', dach: 'DACH — Germany, Austria, Switzerland (formal tone, use Sie, reference VDS 2465 where relevant)', benelux: 'Benelux — Netherlands and Belgium (EN81-28 compliance focus)' };
  const productMap = {
    orion: 'SafeLine Orion (cloud-based lift monitoring and management platform — real-time visibility, brand-independent, data ownership stays with the building owner, NIS2/GDPR compliant, browser-based, no software install)',
    sl6: 'SafeLine SL6 (emergency lift telephone — 4G/5G/VoIP ready, EN81-28 and EN81-70 compliant, wireless configuration via SafeLine LYNX II, no laptop needed, future-proof for PSTN switch-off)',
    nova: 'SafeLine Nova (CANopen-Lift controller — native Orion connectivity, resolve 99% of faults remotely, 5.5" TFT touch display, guided setup, traction and hydraulic versions)',
    lyra: 'SafeLine LYRA (lift data collector — car roof installation, non-invasive, machine learning anomaly detection, compatible with all lift brands, feeds data to Orion)',
    brand: 'SafeLine Group brand awareness (Europe\'s largest independent lift safety manufacturer — 30 years of expertise, full ecosystem: Nova controller, LYRA monitoring sensor, SL6 emergency telephone, SIM connectivity, and Orion cloud platform. Pioneer in lift communication, monitoring and safety technology. Tagline: Your partner in lift safety)'
  };
  const langMap = { en: 'British English', sv: 'Swedish', de: 'German (formal, use Sie)', nl: 'Dutch' };

  const charLimits = state.channel === 'google'
    ? 'For Google Ads: each headline max 30 characters, each description max 90 characters. Be strict.'
    : state.channel === 'linkedin'
    ? 'For LinkedIn Ads: introductory copy max 150 words. Headline max 70 characters. CTA text max 20 characters.'
    : 'For Meta Ads retargeting: primary text max 125 characters. Headline max 40 characters.';

  return `You are a B2B marketing copywriter for SafeLine Group, Europe's largest independent manufacturer of lift safety products.

PRODUCT: ${productMap[state.product]}

CHANNEL: ${channelMap[state.channel]}
AUDIENCE: ${audienceMap[state.audience]}
MARKET: ${marketMap[state.market]}
LANGUAGE: ${langMap[state.lang]}
PRIMARY GOAL: Drive demo bookings for SafeLine Orion at safelineorion.com

BRAND VOICE RULES:
- Technical and precise — name specific standards (EN81-28, EN81-70, NIS2, GDPR)
- Trustworthy and calm — never fear-based, never hyperbolic
- Bold and direct — short declarative sentences
- British English conventions even in templates (use "colour", "organisation" etc.)
- NEVER use: "best in class", "cutting-edge", "seamless", "leverage", "synergy", "game-changer", "innovative"
- Use specific claims over superlatives
- SafeLine brand voice: confident, enabling, professional

${charLimits}

OUTPUT FORMAT — Respond ONLY with valid JSON, no markdown, no preamble:
{
  "variant_a": {
    "angle": "one-word angle description",
    "headlines": ["headline 1", "headline 2", "headline 3"],
    "body": "ad body copy",
    "cta": "CTA text"
  },
  "variant_b": {
    "angle": "one-word angle description",
    "headlines": ["headline 1", "headline 2", "headline 3"],
    "body": "ad body copy",
    "cta": "CTA text"
  },
  "variant_c": {
    "angle": "one-word angle description",
    "headlines": ["headline 1", "headline 2", "headline 3"],
    "body": "ad body copy",
    "cta": "CTA text"
  },
  "targeting": {
    "job_titles": "comma-separated list of relevant job titles",
    "industries": "comma-separated industries",
    "keywords": "5–8 target keywords for this campaign",
    "notes": "one sentence of targeting advice for this market+audience combo"
  }
}`;
}

const charLimits = {
  google: { headline: 30, description: 90 },
  linkedin: { headline: 70, description: 600 },
  meta: { headline: 40, description: 125 }
};

function renderResults(data) {
  const channelLabel = { google: 'Google Ads', linkedin: 'LinkedIn Ads', meta: 'Meta Ads' }[state.channel];
  const audienceLabel = { property_owners: 'Property owners', facilities_managers: 'Facilities managers', lift_companies: 'Lift companies' }[state.audience];
  const marketLabel = { uk: '🇬🇧 UK', sweden: '🇸🇪 Sweden', dach: '🇩🇪 DACH', benelux: '🇳🇱 Benelux' }[state.market];
  const productLabel = { orion: 'SafeLine Orion', sl6: 'SL6', nova: 'Nova', lyra: 'LYRA', brand: 'Brand Awareness' }[state.product];
  const hLimit = charLimits[state.channel].headline;
  const dLimit = charLimits[state.channel].description;

  const variants = ['variant_a', 'variant_b', 'variant_c'];
  const variantLabels = ['Variant A', 'Variant B', 'Variant C'];

  let html = `
    <div class="result-meta">
      <span class="meta-tag channel">${channelLabel}</span>
      <span class="meta-tag audience">${audienceLabel} · ${productLabel}</span>
      <span class="meta-tag market">${marketLabel}</span>
    </div>
    <div class="section-title">Ad variants</div>
    <div class="variants-grid">
  `;

  variants.forEach((v, i) => {
    const variant = data[v];
    if (!variant) return;
    const headlines = Array.isArray(variant.headlines) ? variant.headlines : [];
    html += `
      <div class="variant-card">
        <button class="copy-btn" onclick="copyVariant(this, '${v}')">Copy</button>
        <div class="variant-label">${variantLabels[i]} — ${variant.angle || ''}</div>
        <div class="ad-section">
          <div class="ad-section-label">Headlines</div>
          <div class="ad-headlines">
            ${headlines.map(h => `<div class="headline-item">${h} ${charCount(h, hLimit)}</div>`).join('')}
          </div>
        </div>
        <div class="ad-section">
          <div class="ad-section-label">Body copy</div>
          <div class="ad-body">${variant.body || ''}</div>
        </div>
        <div class="ad-section">
          <div class="ad-section-label">CTA</div>
          <span class="ad-cta">${variant.cta || ''}</span>
        </div>
      </div>
    `;
  });

  html += `</div>`;

  if (data.targeting) {
    html += `
      <div class="section-divider"></div>
      <div class="section-title">Targeting recommendations</div>
      <div class="targeting-box">
        <div class="ad-section-label">For this campaign</div>
        ${data.targeting.job_titles ? `<div class="targeting-line"><strong>Job titles:</strong> ${data.targeting.job_titles}</div>` : ''}
        ${data.targeting.industries ? `<div class="targeting-line"><strong>Industries:</strong> ${data.targeting.industries}</div>` : ''}
        ${data.targeting.keywords ? `<div class="targeting-line"><strong>Keywords:</strong> ${data.targeting.keywords}</div>` : ''}
        ${data.targeting.notes ? `<div class="targeting-line" style="margin-top:10px;color:#d1cac8;">${data.targeting.notes}</div>` : ''}
      </div>
    `;
  }

  document.getElementById('output').innerHTML = html;
}

const variantStore = {};

function copyVariant(btn, variantKey) {
  const v = variantStore[variantKey];
  if (!v) return;
  const text = [
    `--- ${variantKey.toUpperCase().replace('_', ' ')} ---`,
    `Angle: ${v.angle}`,
    `\nHEADLINES:\n${(v.headlines || []).join('\n')}`,
    `\nBODY:\n${v.body}`,
    `\nCTA: ${v.cta}`
  ].join('\n');
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

async function generateAds() {
  const btn = document.getElementById('generate-btn');
  const output = document.getElementById('output');
  btn.disabled = true;
  btn.textContent = 'Generating…';

  output.innerHTML = `<div class="loading-state"><div class="spinner"></div><span>Writing ad copy for ${state.channel} · ${state.market}…</span></div>`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{ role: 'user', content: buildPrompt() }]
      })
    });

    const data = await response.json();
    const raw = data?.content?.[0]?.text || '';

    let parsed;
    try {
      const clean = raw.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    } catch {
      output.innerHTML = `<div class="error-msg">Could not parse response. Raw output:<br><br><pre style="font-size:11px;white-space:pre-wrap;">${raw.substring(0, 800)}</pre></div>`;
      return;
    }

    ['variant_a', 'variant_b', 'variant_c'].forEach(k => {
      if (parsed[k]) variantStore[k] = parsed[k];
    });

    renderResults(parsed);

  } catch (err) {
    output.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate ad copy →';
  }
}
</script>
</body>
</html>
